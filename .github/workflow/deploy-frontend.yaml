name: Deploy Frontend


on:
  workflow_call:
    inputs:
      BUCKET_NAME:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      BUCKET_NAME:
        type: string
        required: true


jobs:
  build:
  runs-on: ubuntu-latest
  needs: lint
  defaults:
    run:
      working-directory: frontend
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build
