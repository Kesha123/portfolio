name: Docker Build and Push


on:
  workflow_dispatch:


env:
  FRONTEND_IMAGE_NAME: portfolio-frontend


jobs:
  build-push-frontend-image:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        registry: ghcr.io

    - name: Build and push Docker image
      id: push
      uses: docker/build-push-action@v6
      with:
        context: ./frontend
        push: true
        tags: ghcr.io/Kesha123/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
        cache-from: type=registry,ref=ghcr.io/Kesha123/${{ env.FRONTEND_IMAGE_NAME }}:buildcahe
        cache-to: type=registry,ref=ghcr.io/Kesha123/${{ env.FRONTEND_IMAGE_NAME }}:buildcahe,mode=max
