name: Helm Package


on:
  workflow_call:
    inputs:
      IMAGE_TAG:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      IMAGE_TAG:
        type: string
        required: true


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Helm
        uses: azure/setup-helm@v1
        with:
          version: v3

      - name: Package Helm chart
        run: |
          helm package kubernetes
          mv kubernetes-*.tgz portfolio-${{ github.event.inputs.IMAGE_TAG }}.tgz

      - name: Upload Helm chart
        uses: actions/upload-artifact@v2
        with:
          name: portfolio-${{ github.event.inputs.IMAGE_TAG }}
